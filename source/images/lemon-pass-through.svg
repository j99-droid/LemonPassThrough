<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="lemon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="1" stop-color="#f9a825"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- lemon body, tilted -->
  <g transform="rotate(-20 128 128)">
    <ellipse cx="128" cy="128" rx="78" ry="58" fill="url(#lemon)"/>
    <ellipse cx="128" cy="128" rx="78" ry="58" fill="none" stroke="#c77800" stroke-width="4" opacity="0.5"/>
    <path d="M50 128 L206 128" stroke="#c77800" stroke-width="3" opacity="0.25"/>
  </g>
  <!-- pass-through lens ring over the lemon -->
  <circle cx="128" cy="128" r="62" fill="none" stroke="#7fdcff" stroke-width="12" stroke-dasharray="26 14"/>
  <circle cx="128" cy="128" r="44" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.8"/>
  <!-- leaf -->
  <path d="M186 58 q28 -6 34 -30 q-28 4 -34 30 z" fill="#4caf50"/>
</svg>
